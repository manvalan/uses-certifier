[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "uses-certifier"
version = "0.5.0"
description = "Stamps methods, classes and source files using YAML rules (Code That Fits in Your Head, Clean Code)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6", "lizard>=1.17"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
uses-certifier = "uses_certifier.cli:main"

[tool.setuptools.packages.find]
include = ["uses_certifier*"]

[tool.setuptools.package-data]
uses_certifier = ["templates/*", "cmake/*"]
